name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\RECON.sln

      - name: Publish single-file executable
        run: >-
          dotnet publish .\src\Recon.App\Recon.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o .\artifacts\publish

      - name: Rename executable
        shell: pwsh
        run: |
          $app = Get-ChildItem .\artifacts\publish -Filter *.exe | Select-Object -First 1
          if (-not $app) { throw 'Published executable was not found.' }
          if ($app.Name -ne 'RECON.exe') {
            Move-Item -LiteralPath $app.FullName -Destination .\artifacts\publish\RECON.exe
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .\artifacts\publish\RECON.exe

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RECON-windows-x64
          path: .\artifacts\publish\RECON.exe
          if-no-files-found: error
